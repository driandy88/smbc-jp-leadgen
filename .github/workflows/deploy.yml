name: Deploy

# main → test → build one image → Cloud Run Job (collector) + Cloud Run service (API + UI)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE: hexline
  JOB: hexline-collect

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/hexline/app:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Shared runtime settings
        run: |
          {
            echo "ENV_VARS=APP_ENV=prd,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${REGION},CLOUDSQL_INSTANCE=${{ secrets.CLOUDSQL_INSTANCE }},GCS_BUCKET=${PROJECT_ID}-data,EXECUTION_MODE=job,COLLECT_JOB_NAME=${JOB},DEFAULT_MOCK=true,VERTEX_REGION=global"
            echo "SECRETS=DB_PASSWORD=db-password:latest,APP_SECRET_KEY=app-secret-key:latest,GOOGLE_MAPS_API_KEY=maps-api-key:latest"
          } >> "$GITHUB_ENV"

      # The service starts executions of this job with "-m app.jobs collect --run-id N"
      - name: Deploy collector job
        run: |
          gcloud run jobs deploy "$JOB" --quiet --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --service-account "${{ secrets.GCP_RUNTIME_SA }}" \
            --set-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE }}" \
            --set-env-vars "$ENV_VARS" --set-secrets "$SECRETS" \
            --command python --args="-m,app.jobs,--help" \
            --memory 2Gi --cpu 1 --task-timeout 6h --max-retries 0

      # Private by default: only principals with roles/run.invoker can reach it. See README → Access.
      - name: Deploy service
        run: |
          gcloud run deploy "$SERVICE" --quiet --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --service-account "${{ secrets.GCP_RUNTIME_SA }}" \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE }}" \
            --set-env-vars "$ENV_VARS" --set-secrets "$SECRETS" \
            --memory 2Gi --cpu 1 --min-instances 0 --max-instances 3
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)'
